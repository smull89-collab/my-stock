def send_telegram_message(text):
    url = "https://api.telegram.org/bot" + TELEGRAM_TOKEN + "/sendMessage"
    payload = {"chat_id": CHAT_ID, "text": text}
    try:
        response = requests.post(url, data=payload, timeout=15)
        res_json = response.json()
        if not res_json.get("ok"):
            print("❌ 텔레그램 발송 실패:", res_json.get("description"))
            return False
        print("✅ 텔레그램 메시지 전송 성공!")
        return True
    except Exception as e:
        print("❌ 통신 오류:", e)
        return False

def get_hottest_theme():
    theme_scores = {}
    for theme_name, etf_symbol in SECTOR_ETFS.items():
        try:
            etf = yf.Ticker(etf_symbol)
            df = etf.history(period="1mo")
            if len(df) < 20:
                continue
            close_now = df["Close"].iloc[-1]
            close_prev = df["Close"].iloc[-6]
            ret_5d = ((close_now - close_prev) / close_prev) * 100
            vol_now = df["Volume"].iloc[-1]
            vol_avg = df["Volume"].rolling(20).mean().iloc[-1]
            vol_ratio = vol_now / vol_avg if vol_avg > 0 else 1.0
            score = (ret_5d * 0.7) + (vol_ratio * 3.0)
            theme_scores[theme_name] = (score, ret_5d, vol_ratio)
        except Exception:
            continue
    if not theme_scores:
        return None, 0, 0
    top_theme = max(theme_scores, key=lambda k: theme_scores[k][0])
    _, top_ret, top_vol = theme_scores[top_theme]
    return top_theme, top_ret, top_vol

def analyze_theme_leader(ticker):
    try:
        stock = yf.Ticker(ticker)
        df = stock.history(period="3mo")
        if df.empty or len(df) < 50:
            return None

        df["Vol_20MA"] = df["Volume"].rolling(20).mean()
        current_vol = df["Volume"].iloc[-1]
        avg_vol = df["Vol_20MA"].iloc[-1]
        vol_ratio = current_vol / avg_vol if avg_vol > 0 else 0
        vol_cond = vol_ratio >= 1.5

        df["OBV"] = (np.sign(df["Close"].diff()) * df["Volume"]).fillna(0).cumsum()
        obv_cond = df["OBV"].iloc[-1] > df["OBV"].rolling(20).mean().iloc[-1]

        df["20MA"] = df["Close"].rolling(20).mean()
        df["50MA"] = df["Close"].rolling(50).mean()
        current_close = df["Close"].iloc[-1]
        pattern_cond = (current_close > df["20MA"].iloc[-1]) and (df["20MA"].iloc[-1] > df["50MA"].iloc[-1])

        if vol_cond and obv_cond and pattern_cond:
            prev_close = df["Close"].iloc[-6]
            price_change_5d = ((current_close - prev_close) / prev_close) * 100
            score = vol_ratio * (1 + (price_change_5d / 100))
            return {
                "ticker": ticker,
                "price": current_close,
                "vol_ratio": vol_ratio,
                "change_5d": price_change_5d,
                "score": score
            }
        return None
    except Exception:
        return None

def analyze_kr_stock(name, symbol):
    try:
        stock = yf.Ticker(symbol)
        df = stock.history(period="3mo")
        if df.empty or len(df) < 20:
            return None

        close = df["Close"].iloc[-1]
        prev_close = df["Close"].iloc[-6]
        change_5d = ((close - prev_close) / prev_close) * 100
        vol_20ma = df["Volume"].rolling(20).mean().iloc[-1]
        vol_ratio = df["Volume"].iloc[-1] / vol_20ma if vol_20ma > 0 else 0.0
        
        ma20 = df["Close"].rolling(20).mean().iloc[-1]
        ma50 = df["Close"].rolling(50).mean().iloc[-1] if len(df) >= 50 else ma20

        if change_5d > 5.0 and close > ma20:
            opinion = "매수 (강한 상승 추세)"
        elif close > ma20 and ma20 >= ma50:
            opinion = "매수 (완만한 상승 추세)"
        else:
            opinion = "중립 / 관망"

        return {
            "name": name,
            "symbol": symbol,
            "price": close,
            "change": change_5d,
            "vol_ratio": vol_ratio,
            "opinion": opinion
        }
    except Exception:
        return None

def analyze_us_sp500(ticker):
    try:
        stock = yf.Ticker(ticker)
        df = stock.history(period="3mo")
        if df.empty or len(df) < 50:
            return None

        close = df["Close"].iloc[-1]
        open_price = df["Open"].iloc[-1]
        prev_high = df["High"].iloc[-2]
        prev_low = df["Low"].iloc[-2]
        volume = df["Volume"].iloc[-1]

        prev_close = df["Close"].iloc[-6]
        change_5d = ((close - prev_close) / prev_close) * 100
        trading_val_million = (volume * close) / 1000000.0

        target_breakout = open_price + (prev_high - prev_low) * 0.5
        v_breakout = close > target_breakout

        ma20 = df["Close"].rolling(20).mean()
        std20 = df["Close"].rolling(20).std()
        bb_upper = ma20.iloc[-1] + (2 * std20.iloc[-1])
        bb_breakout = close > bb_upper

        low_14 = df["Low"].rolling(14).min()
        high_14 = df["High"].rolling(14).max()
        fast_k = ((df["Close"] - low_14) / (high_14 - low_14)) * 100
        slow_k = fast_k.rolling(3).mean().iloc[-1]
        stoch_signal = slow_k > 80

        if v_breakout or bb_breakout:
            signal = "단기 슈팅 매수"
        elif close > ma20.iloc[-1]:
            signal = "상승 추세 유지"
        else:
            signal = "중립 / 관망"

        return {
            "ticker": ticker,
            "price": close,
            "signal": signal,
            "change": change_5d,
            "trading_val": trading_val_million,
            "v_breakout": v_breakout,
            "bb_breakout": bb_breakout,
            "stoch_signal": stoch_signal
        }
    except Exception:
        return None

